<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Admin</title>
<style>
  :root { --red:#e53935; --dark:#1e1e2d; --bg:#f4f6fb; --card:#fff; --green:#2e7d32; --amber:#f9a825; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; background: var(--bg); color:#222; min-height:100vh; }
  .login-wrap { min-height:100vh; display:flex; justify-content:center; align-items:center; background: linear-gradient(135deg,#1e1e2d,#e53935); padding:16px; }
  .card { background:var(--card); padding:24px; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,0.12); }
  .login-card { width:100%; max-width:360px; }
  h1 { margin:0 0 4px; font-size:24px; }
  h2 { margin:0 0 12px; font-size:18px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  .label { display:block; color:var(--muted); font-size:13px; margin-top:8px; }
  input, select { width:100%; padding:12px; margin:6px 0; border:1px solid #d1d5db; border-radius:8px; font-size:16px; background:#fff; }
  button { padding:12px 16px; border:none; border-radius:8px; font-size:15px; cursor:pointer; color:#fff; background:var(--red); }
  button:hover { opacity:0.92; }
  button:disabled { background:#9ca3af; cursor:default; }
  .btn-full { width:100%; margin-top:8px; }
  .btn-dark { background:#374151; }
  .btn-small { padding:6px 10px; font-size:13px; background:#ef4444; }
  .btn-present { padding:6px 10px; font-size:13px; background:var(--green); }
  .msg { min-height:20px; margin-top:10px; font-size:14px; color:#c62828; }
  header { background:var(--dark); color:#fff; padding:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1 { color:#fff; font-size:20px; }
  header span { font-size:13px; opacity:0.8; }
  .container { max-width:1100px; margin:0 auto; padding:16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); border-left:5px solid var(--red); }
  .stat.green { border-color:var(--green); }
  .stat.amber { border-color:var(--amber); }
  .stat.blue { border-color:#1e88e5; }
  .stat .num { font-size:28px; font-weight:bold; }
  .stat .lbl { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns: 1fr; gap:16px; }
  @media (min-width:800px) { .grid { grid-template-columns: 340px 1fr; } }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #eee; white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  .badge { padding:4px 8px; border-radius:20px; font-size:12px; color:#fff; }
  .b-ok { background:var(--green); }
  .b-soon { background:var(--amber); color:#222; }
  .b-exp { background:#c62828; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginBox">
  <div class="card login-card">
    <h1>Gym Login</h1>
    <p class="sub">Owner and staff sign in</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button class="btn-full" id="loginBtn">Login</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminBox" class="hidden">
  <header>
    <div>
      <h1>Gym Admin</h1>
      <span id="userEmail"></span>
    </div>
    <button class="btn-dark" id="logoutBtn">Logout</button>
  </header>

  <div class="container">
    <div class="stats">
      <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">Total members</div></div>
      <div class="stat blue"><div class="num" id="presentCount">0</div><div class="lbl">Present today</div></div>
      <div class="stat green"><div class="num" id="activeCount">0</div><div class="lbl">Active fees</div></div>
      <div class="stat amber"><div class="num" id="soonCount">0</div><div class="lbl">Expiring in 5 days</div></div>
      <div class="stat"><div class="num" id="expiredCount">0</div><div class="lbl">Expired fees</div></div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Add member</h2>
        <input id="mName" placeholder="Full name">
        <input id="mPhone" placeholder="Phone number">
        <label class="label" for="mJoin">Joining date</label>
        <input id="mJoin" type="date">
        <label class="label" for="mFeeStart">Fee start date</label>
        <input id="mFeeStart" type="date">
        <input id="mFee" type="number" placeholder="Fee amount (PKR)">
        <select id="mShift">
          <option value="Morning">Morning shift</option>
          <option value="Evening">Evening shift</option>
        </select>
        <button class="btn-full" id="addBtn">Add member</button>
        <div class="msg" id="addMsg"></div>
      </div>

      <div class="card">
        <h2>Members</h2>
        <input id="search" placeholder="Search by name or phone">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Name</th><th>Phone</th><th>Shift</th><th>Fee</th><th>Fee status</th><th>Today</th><th></th></tr>
            </thead>
            <tbody id="memberRows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, setDoc, doc, onSnapshot, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRuTpQTgzJoHPSGSkRDW9GLw6r4LjJpjM",
  authDomain: "gym-system-82a94.firebaseapp.com",
  projectId: "gym-system-82a94",
  storageBucket: "gym-system-82a94.firebasestorage.app",
  messagingSenderId: "754716077658",
  appId: "1:754716077658:web:de270bcb6ef08d973ab263"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
let allMembers = [];
let presentIds = new Set();
let unsubMembers = null;
let unsubAttendance = null;

// ---------- Login ----------
$("loginBtn").addEventListener("click", async () => {
  $("loginMsg").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  } catch (err) {
    $("loginMsg").textContent = "Login failed. Check your email and password.";
  }
});

$("logoutBtn").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if (user) {
    $("loginBox").classList.add("hidden");
    $("adminBox").classList.remove("hidden");
    $("userEmail").textContent = "Logged in as " + user.email;
    startListening();
  } else {
    $("loginBox").classList.remove("hidden");
    $("adminBox").classList.add("hidden");
    stopListening();
  }
});

// ---------- Helpers ----------
function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

// Today's date as YYYY-MM-DD in the phone's local time
function todayStr() {
  return new Date().toLocaleDateString("en-CA");
}

// Fee lasts 30 days from the fee start date
function daysLeft(feeStart) {
  if (!feeStart) return null;
  const end = new Date(feeStart + "T00:00:00");
  end.setDate(end.getDate() + 30);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.ceil((end - today) / (1000 * 60 * 60 * 24));
}

function feeBadge(days) {
  if (days === null) return "-";
  if (days < 0) return `<span class="badge b-exp">Expired ${Math.abs(days)} days ago</span>`;
  if (days <= 5) return `<span class="badge b-soon">${days} days left</span>`;
  return `<span class="badge b-ok">${days} days left</span>`;
}

// ---------- Live data from Firestore ----------
function startListening() {
  stopListening();

  unsubMembers = onSnapshot(query(collection(db, "members"), orderBy("name")), (snapshot) => {
    allMembers = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderStats();
    renderTable();
  }, (err) => {
    $("memberRows").innerHTML = `<tr><td colspan="7">Could not load members: ${escapeHtml(err.message)}</td></tr>`;
  });

  unsubAttendance = onSnapshot(query(collection(db, "attendance"), where("date", "==", todayStr())), (snapshot) => {
    presentIds = new Set(snapshot.docs.map((d) => d.data().memberId));
    renderStats();
    renderTable();
  });
}

function stopListening() {
  if (unsubMembers) unsubMembers();
  if (unsubAttendance) unsubAttendance();
  unsubMembers = null;
  unsubAttendance = null;
}

function renderStats() {
  let active = 0, soon = 0, expired = 0;
  allMembers.forEach((m) => {
    const d = daysLeft(m.feeStart);
    if (d === null) return;
    if (d < 0) expired++;
    else if (d <= 5) soon++;
    else active++;
  });
  $("totalCount").textContent = allMembers.length;
  $("presentCount").textContent = presentIds.size;
  $("activeCount").textContent = active;
  $("soonCount").textContent = soon;
  $("expiredCount").textContent = expired;
}

function renderTable() {
  const term = $("search").value.trim().toLowerCase();
  const list = allMembers.filter((m) =>
    !term || (m.name || "").toLowerCase().includes(term) || (m.phone || "").includes(term)
  );
  if (list.length === 0) {
    $("memberRows").innerHTML = `<tr><td colspan="7">No members found.</td></tr>`;
    return;
  }
  $("memberRows").innerHTML = list.map((m) => {
    const isPresent = presentIds.has(m.id);
    const presentBtn = isPresent
      ? `<button class="btn-present" disabled>Present</button>`
      : `<button class="btn-present" data-action="present" data-id="${escapeHtml(m.id)}">Mark present</button>`;
    return `
    <tr>
      <td>${escapeHtml(m.name)}</td>
      <td>${escapeHtml(m.phone)}</td>
      <td>${escapeHtml(m.shift)}</td>
      <td>${escapeHtml(m.feeAmount)}</td>
      <td>${feeBadge(daysLeft(m.feeStart))}</td>
      <td>${presentBtn}</td>
      <td><button class="btn-small" data-action="delete" data-id="${escapeHtml(m.id)}">Delete</button></td>
    </tr>`;
  }).join("");
}

$("search").addEventListener("input", renderTable);

// ---------- Table buttons: mark present and delete ----------
$("memberRows").addEventListener("click", async (e) => {
  const action = e.target.dataset.action;
  const id = e.target.dataset.id;
  if (!action || !id) return;

  if (action === "present") {
    const member = allMembers.find((m) => m.id === id);
    // One record per member per day: the id combines the date and member id
    await setDoc(doc(db, "attendance", `${todayStr()}_${id}`), {
      memberId: id,
      name: member ? member.name : "",
      date: todayStr(),
      time: new Date().toLocaleTimeString()
    });
  }

  if (action === "delete" && confirm("Delete this member?")) {
    await deleteDoc(doc(db, "members", id));
  }
});

// ---------- Add member ----------
$("addBtn").addEventListener("click", async () => {
  const name = $("mName").value.trim();
  const phone = $("mPhone").value.trim();
  const feeStart = $("mFeeStart").value;
  const feeAmount = $("mFee").value.trim();

  if (!name || !phone || !feeStart) {
    $("addMsg").style.color = "#c62828";
    $("addMsg").textContent = "Please enter name, phone, and fee start date.";
    return;
  }

  try {
    await addDoc(collection(db, "members"), {
      name,
      phone,
      joinDate: $("mJoin").value || feeStart,
      feeStart,
      feeAmount: feeAmount || "0",
      shift: $("mShift").value,
      createdAt: new Date()
    });
    $("addMsg").style.color = "#2e7d32";
    $("addMsg").textContent = "Member added.";
    ["mName", "mPhone", "mJoin", "mFeeStart", "mFee"].forEach((id) => $(id).value = "");
  } catch (err) {
    $("addMsg").style.color = "#c62828";
    $("addMsg").textContent = "Error: " + err.message;
  }
});
</script>
</body>
</html>
