<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Admin</title>
<style>
  :root { --red:#e53935; --dark:#1e1e2d; --bg:#f4f6fb; --card:#fff; --green:#2e7d32; --amber:#f9a825; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; background: var(--bg); color:#222; min-height:100vh; }
  .login-wrap { min-height:100vh; display:flex; justify-content:center; align-items:center; background: linear-gradient(135deg,#1e1e2d,#e53935); padding:16px; }
  .card { background:var(--card); padding:24px; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,0.12); }
  .login-card { width:100%; max-width:360px; }
  h1 { margin:0 0 4px; font-size:24px; }
  h2 { margin:0 0 12px; font-size:18px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  .label { display:block; color:var(--muted); font-size:13px; margin-top:8px; }
  input, select, textarea { width:100%; padding:12px; margin:6px 0; border:1px solid #d1d5db; border-radius:8px; font-size:16px; background:#fff; font-family:inherit; }
  textarea { min-height:70px; resize:vertical; }
  button { padding:12px 16px; border:none; border-radius:8px; font-size:15px; cursor:pointer; color:#fff; background:var(--red); }
  button:hover { opacity:0.92; }
  button:disabled { background:#9ca3af; cursor:default; }
  .btn-full { width:100%; margin-top:8px; }
  .btn-dark { background:#374151; }
  .btn-small { padding:6px 10px; font-size:13px; background:#ef4444; }
  .btn-edit { padding:6px 10px; font-size:13px; background:#1e88e5; }
  .btn-pay { padding:6px 10px; font-size:13px; background:#8e24aa; }
  .btn-present { padding:6px 10px; font-size:13px; background:var(--green); }
  .msg { min-height:20px; margin-top:10px; font-size:14px; color:#c62828; }
  .hidden { display:none !important; }
  header { background:var(--dark); color:#fff; padding:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1 { color:#fff; font-size:20px; }
  header span { font-size:13px; opacity:0.8; }
  .container { max-width:1100px; margin:0 auto; padding:16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); border-left:5px solid var(--red); }
  .stat.green { border-color:var(--green); }
  .stat.amber { border-color:var(--amber); }
  .stat.blue { border-color:#1e88e5; }
  .stat.purple { border-color:#8e24aa; }
  .stat .num { font-size:26px; font-weight:bold; }
  .stat .lbl { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns: 1fr; gap:16px; }
  @media (min-width:800px) { .grid { grid-template-columns: 360px 1fr; align-items:start; } }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #eee; vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:13px; white-space:nowrap; }
  .small { color:var(--muted); font-size:12px; margin-top:2px; }
  .actions { white-space:nowrap; }
  .actions button { margin:2px 4px 2px 0; }
  .badge { padding:4px 8px; border-radius:20px; font-size:12px; color:#fff; white-space:nowrap; }
  .b-ok { background:var(--green); }
  .b-soon { background:var(--amber); color:#222; }
  .b-exp { background:#c62828; }
  .section-gap { margin-top:16px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginBox">
  <div class="card login-card">
    <h1>Gym Login</h1>
    <p class="sub">Owner and staff sign in</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button class="btn-full" id="loginBtn">Login</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminBox" class="hidden">
  <header>
    <div>
      <h1>Gym Admin</h1>
      <span id="userEmail"></span>
    </div>
    <button class="btn-dark" id="logoutBtn">Logout</button>
  </header>

  <div class="container">
    <div class="stats">
      <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">Total members</div></div>
      <div class="stat blue"><div class="num" id="presentCount">0</div><div class="lbl">Present today</div></div>
      <div class="stat green"><div class="num" id="activeCount">0</div><div class="lbl">Active fees</div></div>
      <div class="stat amber"><div class="num" id="soonCount">0</div><div class="lbl">Expiring in 5 days</div></div>
      <div class="stat"><div class="num" id="expiredCount">0</div><div class="lbl">Expired fees</div></div>
      <div class="stat purple"><div class="num" id="collectedCount">0</div><div class="lbl">Collected this month (PKR)</div></div>
    </div>

    <div class="grid">
      <div>
        <!-- MEMBER FORM -->
        <div class="card">
          <h2 id="formTitle">Add member</h2>
          <input id="fName" placeholder="Full name *">
          <input id="fPhone" placeholder="Phone number *">
          <input id="fEmail" type="email" placeholder="Email (optional)">
          <input id="fAddress" placeholder="Home address">
          <label class="label" for="fDob">Date of birth</label>
          <input id="fDob" type="date">
          <input id="fEmName" placeholder="Emergency contact name">
          <input id="fEmPhone" placeholder="Emergency contact phone">
          <label class="label" for="fJoin">Joining date</label>
          <input id="fJoin" type="date">
          <label class="label" for="fFeeStart">Fee start date *</label>
          <input id="fFeeStart" type="date">
          <input id="fFee" type="number" placeholder="Fee amount (PKR)">
          <select id="fShift">
            <option value="Morning">Morning shift</option>
            <option value="Evening">Evening shift</option>
          </select>
          <textarea id="fNotes" placeholder="Notes (optional)"></textarea>
          <button class="btn-full" id="saveBtn">Add member</button>
          <button class="btn-full btn-dark hidden" id="cancelBtn">Cancel editing</button>
          <div class="msg" id="formMsg"></div>
        </div>

        <!-- RECORD PAYMENT -->
        <div class="card section-gap" id="payCard">
          <h2>Record payment</h2>
          <label class="label" for="payMember">Member</label>
          <select id="payMember"></select>
          <label class="label" for="payAmount">Amount paid (PKR)</label>
          <input id="payAmount" type="number" placeholder="Amount">
          <label class="label" for="payDate">Payment date (fee starts from this day)</label>
          <input id="payDate" type="date">
          <label class="label" for="payMethod">Payment method</label>
          <select id="payMethod">
            <option value="Cash">Cash</option>
            <option value="Bank transfer">Bank transfer</option>
            <option value="JazzCash">JazzCash</option>
            <option value="Easypaisa">Easypaisa</option>
          </select>
          <button class="btn-full" id="payBtn">Save payment</button>
          <div class="msg" id="payMsg"></div>
        </div>
      </div>

      <div>
        <!-- MEMBER LIST -->
        <div class="card">
          <h2>Members</h2>
          <input id="search" placeholder="Search by name, phone, or address">
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Member</th><th>Shift</th><th>Fee</th><th>Fee status</th><th>Today</th><th>Actions</th></tr>
              </thead>
              <tbody id="memberRows"></tbody>
            </table>
          </div>
        </div>

        <!-- PAYMENT HISTORY -->
        <div class="card section-gap">
          <h2>Payment history</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Date</th><th>Member</th><th>Amount</th><th>Method</th></tr>
              </thead>
              <tbody id="paymentRows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, setDoc, doc, onSnapshot, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRuTpQTgzJoHPSGSkRDW9GLw6r4LjJpjM",
  authDomain: "gym-system-82a94.firebaseapp.com",
  projectId: "gym-system-82a94",
  storageBucket: "gym-system-82a94.firebasestorage.app",
  messagingSenderId: "754716077658",
  appId: "1:754716077658:web:de270bcb6ef08d973ab263"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
let allMembers = [];
let allPayments = [];
let presentIds = new Set();
let unsubMembers = null, unsubAttendance = null, unsubPayments = null;
let editingId = null;

// ---------- Login ----------
$("loginBtn").addEventListener("click", async () => {
  $("loginMsg").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  } catch (err) {
    $("loginMsg").textContent = "Login failed. Check your email and password.";
  }
});

$("logoutBtn").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if (user) {
    $("loginBox").classList.add("hidden");
    $("adminBox").classList.remove("hidden");
    $("userEmail").textContent = "Logged in as " + user.email;
    $("payDate").value = todayStr();
    startListening();
  } else {
    $("loginBox").classList.remove("hidden");
    $("adminBox").classList.add("hidden");
    stopListening();
  }
});

// ---------- Helpers ----------
function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function todayStr() {
  return new Date().toLocaleDateString("en-CA");
}

// Fee lasts 30 days from the fee start date
function daysLeft(feeStart) {
  if (!feeStart) return null;
  const end = new Date(feeStart + "T00:00:00");
  end.setDate(end.getDate() + 30);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.ceil((end - today) / (1000 * 60 * 60 * 24));
}

function feeBadge(days) {
  if (days === null) return "-";
  if (days < 0) return `<span class="badge b-exp">Expired ${Math.abs(days)} days ago</span>`;
  if (days <= 5) return `<span class="badge b-soon">${days} days left</span>`;
  return `<span class="badge b-ok">${days} days left</span>`;
}

// ---------- Live data from Firestore ----------
function startListening() {
  stopListening();

  unsubMembers = onSnapshot(query(collection(db, "members"), orderBy("name")), (snapshot) => {
    allMembers = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderStats();
    renderTable();
    renderMemberDropdown();
  }, (err) => {
    $("memberRows").innerHTML = `<tr><td colspan="6">Could not load members: ${escapeHtml(err.message)}</td></tr>`;
  });

  unsubAttendance = onSnapshot(query(collection(db, "attendance"), where("date", "==", todayStr())), (snapshot) => {
    presentIds = new Set(snapshot.docs.map((d) => d.data().memberId));
    renderStats();
    renderTable();
  });

  unsubPayments = onSnapshot(query(collection(db, "payments"), orderBy("date", "desc")), (snapshot) => {
    allPayments = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderStats();
    renderPayments();
  });
}

function stopListening() {
  if (unsubMembers) unsubMembers();
  if (unsubAttendance) unsubAttendance();
  if (unsubPayments) unsubPayments();
  unsubMembers = unsubAttendance = unsubPayments = null;
}

function renderStats() {
  let active = 0, soon = 0, expired = 0;
  allMembers.forEach((m) => {
    const d = daysLeft(m.feeStart);
    if (d === null) return;
    if (d < 0) expired++;
    else if (d <= 5) soon++;
    else active++;
  });

  // Total collected in the current month
  const monthPrefix = todayStr().slice(0, 7);
  const collected = allPayments
    .filter((p) => (p.date || "").startsWith(monthPrefix))
    .reduce((sum, p) => sum + Number(p.amount || 0), 0);

  $("totalCount").textContent = allMembers.length;
  $("presentCount").textContent = presentIds.size;
  $("activeCount").textContent = active;
  $("soonCount").textContent = soon;
  $("expiredCount").textContent = expired;
  $("collectedCount").textContent = collected.toLocaleString();
}

function renderTable() {
  const term = $("search").value.trim().toLowerCase();
  const list = allMembers.filter((m) =>
    !term ||
    (m.name || "").toLowerCase().includes(term) ||
    (m.phone || "").includes(term) ||
    (m.address || "").toLowerCase().includes(term)
  );

  if (list.length === 0) {
    $("memberRows").innerHTML = `<tr><td colspan="6">No members found.</td></tr>`;
    return;
  }

  $("memberRows").innerHTML = list.map((m) => {
    const isPresent = presentIds.has(m.id);
    const presentBtn = isPresent
      ? `<button class="btn-present" disabled>Present</button>`
      : `<button class="btn-present" data-action="present" data-id="${escapeHtml(m.id)}">Mark present</button>`;

    return `
    <tr>
      <td>
        <strong>${escapeHtml(m.name)}</strong>
        <div class="small">${escapeHtml(m.phone)}${m.email ? " · " + escapeHtml(m.email) : ""}</div>
        ${m.address ? `<div class="small">${escapeHtml(m.address)}</div>` : ""}
        ${m.emName ? `<div class="small">Emergency: ${escapeHtml(m.emName)} ${escapeHtml(m.emPhone)}</div>` : ""}
      </td>
      <td>${escapeHtml(m.shift)}</td>
      <td>${escapeHtml(m.feeAmount)}</td>
      <td>${feeBadge(daysLeft(m.feeStart))}</td>
      <td>${presentBtn}</td>
      <td class="actions">
        <button class="btn-pay" data-action="pay" data-id="${escapeHtml(m.id)}">Pay</button>
        <button class="btn-edit" data-action="edit" data-id="${escapeHtml(m.id)}">Edit</button>
        <button class="btn-small" data-action="delete" data-id="${escapeHtml(m.id)}">Delete</button>
      </td>
    </tr>`;
  }).join("");
}

function renderPayments() {
  if (allPayments.length === 0) {
    $("paymentRows").innerHTML = `<tr><td colspan="4">No payments recorded yet.</td></tr>`;
    return;
  }
  $("paymentRows").innerHTML = allPayments.slice(0, 50).map((p) => `
    <tr>
      <td>${escapeHtml(p.date)}</td>
      <td>${escapeHtml(p.name)}</td>
      <td>${escapeHtml(p.amount)}</td>
      <td>${escapeHtml(p.method)}</td>
    </tr>`).join("");
}

function renderMemberDropdown() {
  const current = $("payMember").value;
  $("payMember").innerHTML = `<option value="">Select a member</option>` +
    allMembers.map((m) => `<option value="${escapeHtml(m.id)}">${escapeHtml(m.name)}</option>`).join("");
  if (current) $("payMember").value = current;
}

$("search").addEventListener("input", renderTable);

// ---------- Table buttons: present, pay, edit, delete ----------
$("memberRows").addEventListener("click", async (e) => {
  const action = e.target.dataset.action;
  const id = e.target.dataset.id;
  if (!action || !id) return;

  if (action === "present") {
    const member = allMembers.find((m) => m.id === id);
    await setDoc(doc(db, "attendance", `${todayStr()}_${id}`), {
      memberId: id,
      name: member ? member.name : "",
      date: todayStr(),
      time: new Date().toLocaleTimeString()
    });
  }

  if (action === "pay") {
    const member = allMembers.find((m) => m.id === id);
    $("payMember").value = id;
    $("payAmount").value = member ? member.feeAmount : "";
    $("payDate").value = todayStr();
    $("payMsg").textContent = "";
    $("payCard").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  if (action === "edit") {
    const member = allMembers.find((m) => m.id === id);
    if (member) startEdit(member);
  }

  if (action === "delete" && confirm("Delete this member?")) {
    await deleteDoc(doc(db, "members", id));
    if (editingId === id) resetForm();
  }
});

// ---------- Record payment ----------
$("payBtn").addEventListener("click", async () => {
  const memberId = $("payMember").value;
  const amount = $("payAmount").value.trim();
  const date = $("payDate").value;
  const method = $("payMethod").value;

  if (!memberId || !amount || !date) {
    $("payMsg").style.color = "#c62828";
    $("payMsg").textContent = "Please select a member and enter the amount and date.";
    return;
  }

  const member = allMembers.find((m) => m.id === memberId);
  $("payBtn").disabled = true;
  try {
    // Save the payment in history
    await addDoc(collection(db, "payments"), {
      memberId,
      name: member ? member.name : "",
      amount,
      date,
      method,
      createdAt: new Date()
    });
    // Restart the member's fee from the payment date
    await updateDoc(doc(db, "members", memberId), { feeStart: date, feeAmount: amount });

    $("payMsg").style.color = "#2e7d32";
    $("payMsg").textContent = "Payment saved. Fee renewed from " + date + ".";
    $("payAmount").value = "";
    $("payDate").value = todayStr();
  } catch (err) {
    $("payMsg").style.color = "#c62828";
    $("payMsg").textContent = "Error: " + err.message;
  } finally {
    $("payBtn").disabled = false;
  }
});

// ---------- Form: add or edit ----------
const formFields = {
  name: "fName", phone: "fPhone", email: "fEmail", address: "fAddress",
  dob: "fDob", emName: "fEmName", emPhone: "fEmPhone", joinDate: "fJoin",
  feeStart: "fFeeStart", feeAmount: "fFee", shift: "fShift", notes: "fNotes"
};

function startEdit(member) {
  editingId = member.id;
  for (const [key, inputId] of Object.entries(formFields)) {
    $(inputId).value = member[key] ?? (key === "shift" ? "Morning" : "");
  }
  $("formTitle").textContent = "Edit member";
  $("saveBtn").textContent = "Save changes";
  $("cancelBtn").classList.remove("hidden");
  $("formMsg").textContent = "";
  $("fName").scrollIntoView({ behavior: "smooth", block: "center" });
}

function resetForm() {
  editingId = null;
  for (const inputId of Object.values(formFields)) {
    $(inputId).value = "";
  }
  $("fShift").value = "Morning";
  $("formTitle").textContent = "Add member";
  $("saveBtn").textContent = "Add member";
  $("cancelBtn").classList.add("hidden");
}

$("cancelBtn").addEventListener("click", resetForm);

$("saveBtn").addEventListener("click", async () => {
  const data = {};
  for (const [key, inputId] of Object.entries(formFields)) {
    data[key] = $(inputId).value.trim();
  }
  data.feeAmount = data.feeAmount || "0";

  if (!data.name || !data.phone || !data.feeStart) {
    $("formMsg").style.color = "#c62828";
    $("formMsg").textContent = "Please fill in name, phone, and fee start date.";
    return;
  }

  $("saveBtn").disabled = true;
  try {
    if (editingId) {
      await updateDoc(doc(db, "members", editingId), { ...data, updatedAt: new Date() });
      $("formMsg").style.color = "#2e7d32";
      $("formMsg").textContent = "Changes saved.";
    } else {
      await addDoc(collection(db, "members"), { ...data, createdAt: new Date() });
      $("formMsg").style.color = "#2e7d32";
      $("formMsg").textContent = "Member added.";
    }
    resetForm();
  } catch (err) {
    $("formMsg").style.color = "#c62828";
    $("formMsg").textContent = "Error: " + err.message;
  } finally {
    $("saveBtn").disabled = false;
  }
});
</script>
</body>
</html>
